<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Cyethack HR Portal - Secure employee management, payroll, leave, attendance, and HR analytics." />
    <!-- Private HR portal — intentionally hidden from search engines. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Cyethack HR Portal</title>
    <style>
      /* Critical shell — inlined so the first paint shows the login card skeleton
         instead of a blank white screen while the main bundle loads. */
      :root{--bg:#0f172a;--surface:#172238;--border:#243352;--text:#e6edf7;--text-2:#94a3b8;--muted:#64748b;--teal:#509888;--radius:12px}
      *{box-sizing:border-box;margin:0;padding:0}
      html,body,#root{height:100%;width:100%}
      body{background:var(--bg);color:var(--text);font-family:"IBM Plex Sans","IBM Plex Sans FB",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:14px;line-height:1.4;margin:0}
      #root{display:flex;align-items:stretch;justify-content:flex-start} /* Root cause fix: was align-items:center;justify-content:center which centered .app leaving edge gaps */
      .auth-shell{width:min(440px, 92%);padding:40px 24px}
      .auth-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:32px 26px;box-shadow:0 4px 16px rgba(0,0,0,.25)}
      .auth-brand{display:flex;align-items:center;gap:10px;margin-bottom:6px}
      .auth-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#509888,#346056)}
      .nm{font-weight:700;font-size:18px;letter-spacing:.5px}
      .sl{font-size:11.5px;color:var(--text-2);display:block;margin-top:2px}
      .auth-title{font-size:20px;font-weight:600;margin:14px 0 4px}
      .auth-sub{font-size:13px;color:var(--text-2);margin-bottom:22px}
      .auth-hint{font-size:12.5px;color:var(--muted);text-align:center}
    </style>
    <link rel="preload" as="font" href="/fonts/ibm-plex-sans-latin-400-normal.woff2" type="font/woff2" crossorigin />
    <link rel="icon" href="/favicon.ico" />
  </head>
  <body>
    <div id="root">
      <!-- Static shell painted by HTML before the JS bundle loads; replaced by React on mount. -->
      <div class="auth-shell">
        <div class="auth-card">
          <div class="auth-brand">
            <svg class="auth-mark" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="4" fill="#509888" />
              <path d="M9 9h6v2H9z" fill="#e6edf7" fill-opacity=".9" />
              <path d="M9 13h6v2H9z" fill="#e6edf7" fill-opacity=".9" />
            </svg>
            <span class="nm">CYETHACK</span>
            <span class="sl">HRM Portal — HR · Manager · Employee</span>
          </div>
          <div class="auth-title">Sign in to continue</div>
          <div class="auth-sub">Use one of the demo accounts below to explore each role.</div>
          <div class="auth-hint">Session lasts 12 hours</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
