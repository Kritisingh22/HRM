# One-command run of the whole stack: MongoDB + the API/portal.
#
#   1) copy server/.env.example values you care about into a .env next to this file
#      (at minimum set JWT_SECRET and JWT_REFRESH_SECRET to long random strings)
#   2) docker compose up --build
#   3) open http://localhost:5000   (then run the seed once — see README)
#
# NOTE: cookies are marked "Secure" only when NODE_ENV=production, which needs
# HTTPS. For a quick LOCAL trial over plain http, the default below uses
# development mode. For real deployment set NODE_ENV=production and put this
# behind an HTTPS reverse proxy (or a platform that terminates TLS).

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/cyethack_hr
      # Document storage (optional — see server/.env.example). Left unset, files
      # stay on the local uploads volume. For a file-based service-account key,
      # mount it into the container and point GOOGLE_SERVICE_ACCOUNT_FILE at it.
      DOCUMENT_STORAGE: ${DOCUMENT_STORAGE:-}
      GOOGLE_DRIVE_FOLDER_ID: ${GOOGLE_DRIVE_FOLDER_ID:-}
      GOOGLE_DRIVE_AUTH_MODE: ${GOOGLE_DRIVE_AUTH_MODE:-service_account}
      GOOGLE_SERVICE_ACCOUNT_FILE: ${GOOGLE_SERVICE_ACCOUNT_FILE:-}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${GOOGLE_OAUTH_REFRESH_TOKEN:-}
      GOOGLE_DRIVE_TEST_FOLDER_ID: ${GOOGLE_DRIVE_TEST_FOLDER_ID:-}
      PAYSLIP_ARCHIVE_TO_DRIVE: ${PAYSLIP_ARCHIVE_TO_DRIVE:-false}
      JWT_SECRET: ${JWT_SECRET:-dev-access-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me}
      ACCESS_TOKEN_EXPIRES_IN: ${ACCESS_TOKEN_EXPIRES_IN:-15m}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5000}
    ports:
      - "5000:5000"
    volumes:
      - uploads:/app/uploads

volumes:
  mongo-data:
  uploads:
