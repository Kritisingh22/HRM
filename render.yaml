services:
  - type: web
    name: cyethack-hrm-portal
    env: node
    region: oregon
    branch: main
    buildCommand: npm --prefix client ci && npm --prefix client run build && npm --prefix server ci && node scripts/sync-dist.js
    startCommand: npm --prefix server start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        # Set manually — do not bind to a fromDatabase in this repo. Replace with
        # your production MongoDB connection string (no real credentials below).
        value: mongodb://127.0.0.1:27017/cyethack_hr
      - key: JWT_SECRET
        generateValue: true
        sync: false
      - key: JWT_REFRESH_SECRET
        generateValue: true
        sync: false
      - key: FRONTEND_URL
        value: https://cyethack-hrm-portal.onrender.com
      - key: FRONTEND_DIST
        value: server/public
      - key: MAX_FAILED_LOGINS
        value: 5
      - key: ACCOUNT_LOCK_MINUTES
        value: 15
      - key: SETUP_TOKEN
        generateValue: true
        sync: false
      - key: PAYROLL_CURRENCY
        value: INR
      - key: DOCUMENT_STORAGE
        value: cloudflare-r2
      - key: R2_ACCOUNT_ID
        value: ""
      - key: R2_ACCESS_KEY_ID
        value: ""
      - key: R2_SECRET_ACCESS_KEY
        value: ""
      - key: R2_BUCKET_NAME
        value: ""
      - key: R2_ENDPOINT
        value: ""
      - key: R2_REGION
        value: auto
    healthCheckPath: /health
    autoDeploy: true
